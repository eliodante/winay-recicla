<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f7a4d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wiñay" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Wiñay Recicla</title>
    <link rel="stylesheet" href="./assets/main.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Librerías de Firebase compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
      // Configuración con tus credenciales de Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyBkk7c8GPdw_xUgQLhRN61f__0utmRx1Tg",
        authDomain: "winay-recicla.firebaseapp.com",
        databaseURL: "https://winay-recicla-default-rtdb.firebaseio.com",
        projectId: "winay-recicla",
        storageBucket: "winay-recicla.firebasestorage.app",
        messagingSenderId: "759468595210",
        appId: "1:759468595210:web:5b8575a9f57845668567f3",
        measurementId: "G-HQ3E27368Z"
      };

      // Inicializar Firebase
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      window.db = firebase.database();

      const KEY_AVISOS = "winay_recicla_avisos_v1";
      let omitirEnvio = false;

      // 1. Escuchar a Firebase: Cuando alguien publica en el celular, la laptop recibe los datos
      window.db.ref("avisos").on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          omitirEnvio = true;
          localStorage.setItem(KEY_AVISOS, JSON.stringify(data));
          window.dispatchEvent(new Event("storage"));
          omitirEnvio = false;
        }
      });

      // 2. Interceptar guardado: Cuando React guarda un aviso, se envía solito a Firebase
      const guardarEnNavegador = localStorage.setItem.bind(localStorage);
      localStorage.setItem = function (key, value) {
        guardarEnNavegador(key, value);
        if (key === KEY_AVISOS && !omitirEnvio) {
          try {
            const datosParseados = JSON.parse(value);
            window.db.ref("avisos").set(datosParseados);
          } catch (e) {
            console.error("Error al sincronizar con Firebase:", e);
          }
        }
      };
    </script>

    <!-- Cargar la aplicación React empaquetada -->
    <script type="module" src="./assets/main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
